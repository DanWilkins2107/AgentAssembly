name: backend-ci

# Reproducibility harness: proves the Supabase backend rebuilds and boots from
# this repo alone. Two independent jobs are the insertion points the sibling
# backend test suites plug into without restructuring:
#   - Database test suite (pgTAP)     -> add steps to the `db` job.
#   - Edge Function test suite (Deno) -> add steps to the `functions` job.
#
# The backend is being rebuilt piece by piece; today the tree has config.toml
# but no migrations, seed, or functions yet. This gate stays green on what
# exists now and tightens automatically as those pieces land.

on:
  push:
  pull_request:

jobs:
  db:
    name: DB - rebuild & boot from repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Core reproducibility gate: the local stack must boot from the committed
      # supabase/config.toml alone. As migrations and supabase/seed.sql land,
      # `supabase start` applies them too, so this stays the rebuild proof.
      - name: Start stack from repo config
        run: supabase start

      - name: Verify services are healthy
        run: supabase status

      # --- INSERTION POINT: DB rebuild + pgTAP tests ---
      # Once supabase/migrations/ and supabase/seed.sql exist, add:
      #   - run: supabase db reset   # re-apply every migration + seed from scratch
      # The Database test suite (pgTAP) node attaches its test run here.

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup

  functions:
    name: Functions - typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Typecheck every edge function that exists. Green with zero functions
      # today; covers each supabase/functions/<name> automatically as it lands.
      - name: Typecheck edge functions
        run: |
          shopt -s nullglob
          found=0
          for fn in supabase/functions/*/index.ts; do
            found=1
            echo "deno check $fn"
            deno check "$fn"
          done
          if [ "$found" = 0 ]; then
            echo "No edge functions yet - nothing to typecheck."
          fi

      # --- INSERTION POINT: Edge Function (Deno) test suite ---
      # The Edge Function test suite node attaches its `deno test` steps here.
