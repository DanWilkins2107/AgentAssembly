name: backend-ci

on:
  push:
    paths-ignore:
      - 'terraform/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'terraform/**'
      - '**.md'

jobs:
  db:
    name: DB - rebuild & boot from repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start stack from repo config
        run: supabase start

      - name: Verify services are healthy
        run: supabase status

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Install test deps
        run: npm ci

      - name: Run DB tests
        run: npm test -w agentassembly-db-tests

      - name: Run auth policy tests
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm test -w agentassembly-auth-tests

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup

  functions:
    name: Functions - typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        run: |
          shopt -s nullglob
          found=0
          for fn in supabase/functions/*/index.ts; do
            found=1
            echo "deno check $fn"
            deno check "$fn"
          done
          if [ "$found" = 0 ]; then
            echo "No edge functions yet - nothing to typecheck."
          fi

  cli:
    name: CLI - typecheck & test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w agentassembly-cli

      - name: Test with coverage
        run: npm run test:coverage -w agentassembly-cli

  cli-mutation:
    name: CLI - mutation testing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Mutation testing
        run: npm run test:mutation -w agentassembly-cli
