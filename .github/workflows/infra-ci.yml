name: infra-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform - fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      - name: Validate every terraform directory
        run: |
          for dir in $(find terraform -type f -name '*.tf' -printf '%h\n' | sort -u); do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  squid-access-log:
    name: Squid - access-log redaction & log-dir perms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot the rendered squid.conf and assert the log is redacted
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ubuntu:24.04 \
            terraform/modules/vm/tests/squid-access-log.sh
