name: infra-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform - fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      - name: Validate every terraform directory
        run: |
          for dir in $(find terraform -type f -name '*.tf' -printf '%h\n' | sort -u); do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  squid-access-log:
    name: Squid - access-log redaction & log-dir perms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot the rendered squid.conf and assert the log is redacted
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ubuntu:24.04 \
            terraform/modules/vm/tests/squid-access-log.sh

  plan:
    name: Terraform - plan (root)
    if: github.event_name == 'pull_request'
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Require CI_PLAN_ROLE_ARN
        shell: bash
        env:
          ROLE_ARN: ${{ vars.CI_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Repository variable CI_PLAN_ROLE_ARN is unset. Set it with: gh variable set CI_PLAN_ROLE_ARN --body \"\$(terraform -chdir=terraform/iam output -raw ci_plan_role_arn)\""
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_PLAN_ROLE_ARN }}
          # Pinned in terraform/locals.tf and terraform/backend.tf; rename there -> rename here.
          aws-region: eu-west-2

      - name: Plan
        shell: bash
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform plan -no-color -input=false -var-file=ci.tfvars 2>&1 | tee plan.txt

      - name: Sticky plan comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          limit=60000
          {
            echo '### Terraform plan - root'
            echo '```terraform'
            head -c "$limit" plan.txt
            echo
            echo '```'
            if [ "$(wc -c < plan.txt)" -gt "$limit" ]; then
              echo "Truncated at $limit bytes; the full plan is in the job log."
            fi
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none
