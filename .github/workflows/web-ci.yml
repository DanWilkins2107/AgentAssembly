name: web-ci

on:
  push:
    paths-ignore:
      - 'terraform/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'terraform/**'
      - '**.md'

jobs:
  web:
    name: Web - typecheck, lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w agentassembly-web

      - name: Lint
        run: npm run lint -w agentassembly-web

      - name: Test
        run: npm run test -w agentassembly-web

      - name: Build
        run: npm run build -w agentassembly-web
