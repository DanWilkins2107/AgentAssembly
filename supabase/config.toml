# AgentAssembly — Supabase CLI config.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Scope: these settings drive the local stack (`supabase start`) and are pushed
# to the linked hosted project with `supabase config push`. They are not applied
# automatically by a git push or by `supabase db push` — config is synced by its
# own command.
#
# Auth is deliberately locked down here: accounts are operator-provisioned and
# there is no self-signup path, so membership is never a side effect of signing
# up and knowing an email address gets an attacker nothing.

project_id = "agentassembly"

[auth]
enabled = true

# Users are provisioned by an operator via the Supabase dashboard, never by a
# public signup form. Top-level enable_signup gates public signup
# (GOTRUE_DISABLE_SIGNUP); the [auth.email] flag below is a different lever.
enable_signup = false

# Email/password is the only provider. No external OAuth, no anonymous users.
enable_anonymous_sign_ins = false

# Lifetimes are set explicitly rather than inherited from CLI defaults so the
# access-token window is a reviewed decision. 1h access tokens keep the window
# for a leaked JWT short while staying long enough that a long-running agent
# run is not refreshing constantly. Rotation on means a stolen refresh token is
# single-use; the 10s reuse interval only forgives a genuine race between two
# concurrent refreshes of the same token, and any later reuse revokes the
# family.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Operator-set passwords, so a strict policy costs nothing at provisioning time.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
# Per-provider flag gates the whole email/password provider including LOGIN, not
# just signup (GOTRUE_EXTERNAL_EMAIL_ENABLED). Must stay true or provisioned
# users can't sign in. Public signup stays blocked by top-level [auth] above.
enable_signup = true

# No confirmation round-trip: an account only exists because an operator created
# it in the dashboard, so there is no unverified address to prove ownership of.
enable_confirmations = false

# Changing an existing address still requires confirming from both the old and
# the new one — that flow is user-initiated, so it does need proof.
double_confirm_changes = true
